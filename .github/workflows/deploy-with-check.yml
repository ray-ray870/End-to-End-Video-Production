name: 構文チェック後にデプロイ

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: index.html内のJavaScriptを取り出して構文チェック
        run: |
          python3 - << 'PYEOF'
          import re, sys
          content = open('index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>(.*?)</script>', content, re.DOTALL)
          if len(scripts) < 2:
              print('::error::scriptタグが想定より少ないです。ファイルが壊れている可能性があります。')
              sys.exit(1)
          js_code = scripts[-1]
          with open('_extracted.js', 'w', encoding='utf-8') as f:
              f.write(js_code)
          PYEOF
          node --check _extracted.js

      - name: HTMLタグの開閉バランスを確認
        run: |
          python3 - << 'PYEOF'
          import sys
          content = open('index.html', encoding='utf-8').read()
          open_count = content.count('<div')
          close_count = content.count('</div>')
          if open_count != close_count:
              print(f'::error::<div>の数({open_count})と</div>の数({close_count})が一致していません。')
              sys.exit(1)
          print(f'<div>タグのバランス: OK ({open_count}組)')
          PYEOF

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pagesの設定を準備
        uses: actions/configure-pages@v5

      - name: 公開用データをまとめる
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pagesに公開
        id: deployment
        uses: actions/deploy-pages@v4
